# software-agent reverse proxy (install alongside MediNexPlus nginx config)
# Suggested path: /etc/nginx/sites-available/software-agent.conf
# Domains: agent / agent-api / agent-worker / *.ide.ansarisaif.com
# After install: certbot for agent*.ansarisaif.com; wildcard *.ide needs DNS-01

map $http_upgrade $connection_upgrade_sa {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name agent.ansarisaif.com;

    client_max_body_size 50m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_sa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_pass http://127.0.0.1:3010;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name agent-api.ansarisaif.com;

    client_max_body_size 50m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_sa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_pass http://127.0.0.1:8080;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name agent-worker.ansarisaif.com;

    client_max_body_size 50m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_sa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_pass http://127.0.0.1:9091;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<ide_session>.+)\.ide\.ansarisaif\.com$;

    client_max_body_size 100m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_sa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8888;
    }
}
