# software-agent reverse proxy (installed alongside the existing host nginx config)
# Install path: /etc/nginx/sites-available/software-agent.conf (scripts/bootstrap-server.sh)
#
# Public hosts:
#   agent.ansarisaif.com          -> web  (127.0.0.1:3010)
#   agent-api.ansarisaif.com      -> api  (127.0.0.1:8080)
#   <id>.sandbox.ansarisaif.com   -> traefik (127.0.0.1:8888) -> per-project sandbox
#
# The worker and sandbox-controller have no public hostname. The old
# agent-worker.ansarisaif.com and *.ide.ansarisaif.com hosts are intentionally gone.
#
# Certificates (Let's Encrypt):
#   certbot certonly --webroot -w /var/www/letsencrypt \
#     -d agent.ansarisaif.com -d agent-api.ansarisaif.com          # -> live/agent.ansarisaif.com
#   certbot certonly --manual --preferred-challenges dns \
#     -d '*.sandbox.ansarisaif.com'                                 # -> live/sandbox.ansarisaif.com
#
# NOTE: sandboxes serve user/LLM-generated code. Hosting them under a subdomain of the
# product's own registrable domain lets that code set cookies on .ansarisaif.com and
# share a "site" with the app. Production should move sandboxes to a separate
# registrable domain (e.g. *.agentsandbox.app) and update SANDBOX_BASE_DOMAIN /
# NEXT_PUBLIC_SANDBOX_BASE_DOMAIN accordingly.

map $http_upgrade $connection_upgrade_sa {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=sa_api:10m     rate=10r/s;
limit_req_zone $binary_remote_addr zone=sa_sandbox:10m rate=30r/s;
limit_req_status 429;

# ---------------------------------------------------------------------------
# HTTP -> HTTPS (ACME http-01 challenges are still served over HTTP)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name agent.ansarisaif.com agent-api.ansarisaif.com
                ~^(?<sbx_http>[a-z0-9-]+)\.sandbox\.ansarisaif\.com$;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Web app
# ---------------------------------------------------------------------------
server {
    # `listen ... http2` (not `http2 on;`) keeps this valid on nginx < 1.25.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent.ansarisaif.com;

    ssl_certificate     /etc/letsencrypt/live/agent.ansarisaif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.ansarisaif.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:sa_ssl:10m;
    ssl_session_timeout 1d;

    client_max_body_size 6m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_sa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:3010;
    }
}

# ---------------------------------------------------------------------------
# Retired worker host: answer explicitly instead of falling through to the default server.
# The existing certificate still lists it as a SAN.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent-worker.ansarisaif.com;

    ssl_certificate     /etc/letsencrypt/live/agent.ansarisaif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.ansarisaif.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    return 410;
}

# ---------------------------------------------------------------------------
# Public API (only public backend surface)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent-api.ansarisaif.com;

    ssl_certificate     /etc/letsencrypt/live/agent.ansarisaif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.ansarisaif.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:sa_ssl:10m;
    ssl_session_timeout 1d;

    client_max_body_size 6m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Run event streams (SSE: /v1/runs/:id/events). Unbuffered and long-lived.
    location /v1/runs/ {
        limit_req zone=sa_api burst=20 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # add_header in a location replaces (does not extend) the server-level set.
        add_header X-Accel-Buffering "no" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;

        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        limit_req zone=sa_api burst=20 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8080;
    }
}

# ---------------------------------------------------------------------------
# Per-project sandboxes (code-server + previews) via Traefik.
# Traefik applies the sandbox-auth@docker forwardAuth middleware on every request.
# No X-Frame-Options here: the web app embeds sandboxes in an iframe.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<sbx>[a-z0-9-]+)\.sandbox\.ansarisaif\.com$;

    ssl_certificate     /etc/letsencrypt/live/sandbox.ansarisaif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sandbox.ansarisaif.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:sa_ssl:10m;
    ssl_session_timeout 1d;

    client_max_body_size 6m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        limit_req zone=sa_sandbox burst=60 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_sa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:8888;
    }
}
