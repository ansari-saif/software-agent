name: Deploy software-agent

# Runs after "CI Quality & Security Gate" succeeds on main (or manually).
# 1. Builds and pushes every image to GHCR tagged with the commit SHA.
# 2. Copies compose/scripts/nginx config to the server and runs scripts/deploy.sh <sha>
#    as a non-root deploy user.

on:
  workflow_run:
    workflows: ["CI Quality & Security Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_public:
        description: "Skip public HTTPS smoke checks (SMOKE_SKIP_PUBLIC=1)"
        required: false
        default: "0"

concurrency:
  group: deploy-software-agent
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/software-agent
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: Build & push ${{ matrix.image }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            context: .
            target: api
          - image: worker
            context: .
            target: worker
          - image: sandbox-controller
            context: .
            target: sandbox-controller
          - image: web
            context: .
            target: web
          - image: migrate
            context: .
            target: migrate
          - image: sandbox
            context: apps/sandbox-image
            target: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: name
        run: echo "ref=$(echo '${{ env.IMAGE_PREFIX }}-${{ matrix.image }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          target: ${{ matrix.target }}
          push: true
          provenance: false
          tags: ${{ steps.name.outputs.ref }}:${{ env.DEPLOY_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://agent-api.ansarisaif.com' }}
            NEXT_PUBLIC_SANDBOX_BASE_DOMAIN=${{ vars.NEXT_PUBLIC_SANDBOX_BASE_DOMAIN || 'sandbox.ansarisaif.com' }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy ${{ github.event.workflow_run.head_sha || github.sha }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Copy compose, scripts and nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          source: "docker-compose.yml,scripts/,deploy/"
          target: ${{ vars.DEPLOY_PATH || '/opt/software-agent' }}
          overwrite: true

      - name: Run deploy script
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/software-agent' }}
          SMOKE_SKIP_PUBLIC: ${{ github.event.inputs.skip_public || '0' }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          command_timeout: 25m
          envs: DEPLOY_SHA,DEPLOY_PATH,SMOKE_SKIP_PUBLIC,GHCR_OWNER,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export GHCR_OWNER="$(echo "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
            export SMOKE_SKIP_PUBLIC
            status=0
            bash scripts/deploy.sh "$DEPLOY_SHA" || status=$?
            docker logout ghcr.io >/dev/null 2>&1 || true
            exit "$status"
