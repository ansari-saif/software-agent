name: CI Quality & Security Gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_ci_only
          POSTGRES_DB: software_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test_password_ci_only@localhost:5432/software_agent_test
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_SANDBOX_BASE_DOMAIN: sandbox.example.com
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Supply-chain audit (high/critical)
        run: pnpm audit --audit-level=high --prod

      - name: Generate Prisma client and apply migrations
        run: pnpm --filter db exec prisma migrate deploy && pnpm --filter db generate

      - name: Typecheck
        run: pnpm run check-types

      - name: Lint
        run: pnpm run lint

      - name: Unit, regression & integration tests
        run: pnpm run test
        env:
          RUN_DB_TESTS: "1"

      - name: Build all packages and apps
        run: pnpm run build
