services:
  # Build-only helpers for IDE session images (not always-on).
  # Usage: docker compose -f apps/code-server/docker-compose.yml build
  code-server-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: software-agent-code-server-backend:latest
    profiles: ["build"]

  code-server-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: software-agent-code-server-frontend:latest
    profiles: ["build"]
